name: Preparar artefatos npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão estável integrada X.Y.Z (sem publicação)
        required: true
        type: string

concurrency:
  group: release-publication
  queue: max

jobs:
  resolve-validate:
    name: Resolver e validar
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      backmerge_sha: ${{ steps.resolve.outputs.backmerge_sha }}
      develop_sha: ${{ steps.evidence.outputs.develop_sha }}
      release_notes_sha: ${{ steps.evidence.outputs.release_notes_sha }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validar ref e versão
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" == "develop" ]] || { echo "Dispare este workflow a partir de develop" >&2; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Versão inválida: $VERSION" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - id: resolve
        name: Resolver release e back-merge
        shell: bash
        run: |
          RELEASE_JSON="$(node ./scripts/release-github.mjs resolve "$VERSION" master)"
          BACKMERGE_JSON="$(node ./scripts/release-github.mjs resolve "$VERSION" develop)"
          RELEASE_SHA="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.merge_commit_sha)' "$RELEASE_JSON")"
          BACKMERGE_SHA="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.merge_commit_sha)' "$BACKMERGE_JSON")"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "backmerge_sha=$BACKMERGE_SHA" >> "$GITHUB_OUTPUT"
          git fetch origin master develop --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/master || { echo "Commit liberado não pertence ao histórico atual de master" >&2; exit 1; }
          git merge-base --is-ancestor "$BACKMERGE_SHA" origin/develop || { echo "Back-merge não pertence ao histórico atual de develop" >&2; exit 1; }
          node ./scripts/release-github.mjs predecessor "$VERSION"
          node ./scripts/release-github.mjs state "$VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run release:validate -- "$VERSION"
      - run: npm run --silent release:notes -- "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run release:validate -- "$VERSION"
      - id: evidence
        name: Comparar changelog do back-merge e registrar evidência
        shell: bash
        run: |
          RELEASE_NOTES_SHA="$(sha256sum "$RUNNER_TEMP/release-notes.md" | cut -d ' ' -f 1)"
          DEVELOP_NOTES_SHA="$(npm run --silent release:notes -- "$VERSION" | sha256sum | cut -d ' ' -f 1)"
          [[ "$DEVELOP_NOTES_SHA" == "$RELEASE_NOTES_SHA" ]] || { echo "Bloco fechado em develop diverge do commit liberado" >&2; exit 1; }
          echo "develop_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_notes_sha=$RELEASE_NOTES_SHA" >> "$GITHUB_OUTPUT"

  prepare-npm:
    name: Empacotar e validar npm sem publicar
    needs: resolve-validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ needs.resolve-validate.outputs.release_sha }}
      PUBLIC_PACK_DIR: ${{ github.workspace }}/source/npm-release-artifacts
    steps:
      - name: Checkout da lógica confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-validate.outputs.release_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm install --global npm@11.19.1
      - name: Bloquear re-run e geração após publicação parcial
        run: node ./scripts/release-artifact.mjs guard "$VERSION" "$RELEASE_SHA"
      - run: npm ci --ignore-scripts
        working-directory: source
      - run: npx playwright install --with-deps chromium
        working-directory: source
      - name: Construir e testar os quatro tarballs definitivos
        run: npm run verify:distribution
        working-directory: source
      - id: plan
        name: Vincular hashes ao merge e à execução de preparação
        run: node ../scripts/release-artifact.mjs plan "$VERSION" "$RELEASE_SHA" "$PUBLIC_PACK_DIR"
        working-directory: source
      - id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: source/npm-release-artifacts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Registrar identidade para bootstrap e publicação posterior
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          echo "Artifact ID: $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest ZIP SHA-256: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Merge SHA: $RELEASE_SHA; run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          echo "Solicitados 90 dias; conferir expires_at real antes do bootstrap." >> "$GITHUB_STEP_SUMMARY"
