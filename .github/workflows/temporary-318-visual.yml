name: Temporary visual verification for #318

on:
  push:
    branches:
      - feat/318-responsive-layout-patterns

permissions:
  contents: read

jobs:
  visual:
    name: Testar reflow e capturar #318
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace @dvmarques/admin-ds-tokens
      - run: npm run build --workspace @dvmarques/admin-ds-components
      - run: npm run build --workspace @dvmarques/admin-ds-highlighted-code
      - run: npm run build --workspace @dvmarques/admin-ds-admin
      - run: npm run build --workspace @admin-ds/admin-demo
      - name: Capturas responsivas #318
        run: npx playwright test --config playwright.visual-audit.config.ts visual-audit/responsive-layout.spec.ts --reporter=list
      - name: Publicar capturas e relatórios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-318
          path: visual-audit-results/
          if-no-files-found: warn
          retention-days: 14
