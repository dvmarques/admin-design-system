name: "Issue 265 - lote 2: ajuste de snapshot (temporário)"
on:
  push:
    branches: [issue-265-deps-batch2]
    paths:
      - .github/workflows/issue-265-batch2-finalize.yml
permissions:
  contents: write
concurrency:
  group: issue-265-batch2-finalize
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-265-deps-batch2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm exec -- prettier --write e2e/account-notifications-organization.spec.ts
      - run: npm exec -- prettier --check e2e/account-notifications-organization.spec.ts
      - run: npm run build --workspace @dvmarques/admin-ds-tokens
      - run: npm run build --workspace @dvmarques/admin-ds-components
      - run: npm run build --workspace @dvmarques/admin-ds-highlighted-code
      - run: npm run build --workspace @dvmarques/admin-ds-admin
      - run: npm run build --workspace @admin-ds/admin-demo
      - name: Atualizar somente snapshot de componentes escuro afetado pelo Chromium 1.64.1
        run: |
          set -euo pipefail
          npx playwright test e2e/admin-demo-routes.spec.ts --project=chromium --grep 'mantém a apresentação de /componentes nos temas claro e escuro' --update-snapshots=changed --reporter=line
      - name: Confirmar teste visual atualizado sem modo update
        run: npx playwright test e2e/admin-demo-routes.spec.ts --project=chromium --grep 'mantém a apresentação de /componentes nos temas claro e escuro' --reporter=line
      - name: Commit somente dos dois arquivos esperados
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/account-notifications-organization.spec.ts e2e/admin-demo-routes.spec.ts-snapshots/componentes-dark-chromium-linux.png
          git diff --cached --check
          if git diff --cached --quiet; then echo "Nenhuma alteração"; exit 0; fi
          git diff --cached --name-only | sort > /tmp/actual-files
          printf '%s\n' e2e/account-notifications-organization.spec.ts e2e/admin-demo-routes.spec.ts-snapshots/componentes-dark-chromium-linux.png | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          HUSKY=0 git commit -m "test(e2e): format and refresh Playwright 1.64.1 visual baseline (#265)"
          git push origin HEAD:refs/heads/issue-265-deps-batch2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: issue-265-batch2-visual-troubleshooting
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
