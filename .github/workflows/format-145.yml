name: Format AdsAlert #145
on:
  push:
    branches:
      - feat/145-ads-alert-callout
    paths:
      - .github/workflows/format-145.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/145-ads-alert-callout
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: >
          npx prettier --write
          apps/admin-demo/app/catalogo/catalog-demos.tsx
          apps/docs/src/alert.stories.tsx
          docs/integration.md
          e2e/alert.spec.ts
          openspec/changes/feat-145-ads-alert-callout/design.md
          openspec/changes/feat-145-ads-alert-callout/proposal.md
          openspec/changes/feat-145-ads-alert-callout/specs/ads-alert/spec.md
          openspec/changes/feat-145-ads-alert-callout/tasks.md
          packages/components/src/alert.tsx
          packages/components/tests/alert.test.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin-demo/app/catalogo/catalog-demos.tsx apps/docs/src/alert.stories.tsx docs/integration.md e2e/alert.spec.ts openspec/changes/feat-145-ads-alert-callout packages/components/src/alert.tsx packages/components/tests/alert.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format AdsAlert implementation #145"
            git push origin HEAD:feat/145-ads-alert-callout
          fi
