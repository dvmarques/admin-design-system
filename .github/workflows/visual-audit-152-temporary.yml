# TEMPORÁRIO: exclusivamente para validar a fase 4 da #152 na branch.
# Remover integralmente antes de entregar PR Ready final; auditoria definitiva continua manual.
name: Fase 4 152 - validação temporária

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  format-branch:
    if: github.event.pull_request.draft == false && github.head_ref == 'feat/152-visual-a11y-zoom-keyboard' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format

  audit-browser:
    needs: format-branch
    if: github.event.pull_request.draft == false && github.head_ref == 'feat/152-visual-a11y-zoom-keyboard' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verificar formatação
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Build completo
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Testes de qualidade
        run: npm run test:quality
      - name: Testes E2E completos
        run: npm run test:e2e
      - name: Validar OpenSpec estrito
        run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict --no-interactive
      - name: Executar auditoria opt-in em Chromium real
        run: npm run audit:visual
      - name: Publicar evidências temporárias
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fase4-152-browser-${{ github.run_id }}
          path: visual-audit-results/
          if-no-files-found: warn
          retention-days: 14
