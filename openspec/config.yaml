schema: spec-driven

context: |
  Projeto: Admin Design System, monorepo React/TypeScript para Next.js App Router.
  Fonte única de políticas obrigatórias para agentes: AGENTS.md.
  Mapa de contexto por pacote e referências sob demanda: docs/agent-context-map.md.
  Contratos públicos: Ads* (componentes), ads- (classes), --ads- (tokens).
  Preserve identidade visual, acessibilidade WCAG 2.2 AA, temas claro/escuro,
  compatibilidade Server/Client Components e CSS compilado distribuível.
  Consulte docs/architecture.md, docs/visual-identity.md e docs/integration.md
  somente quando o escopo afetar arquitetura, visual ou consumo, respectivamente.
  Implementação própria e independente; registre licenças e atribuições conforme
  docs/licensing.md ao incorporar material de terceiros.
  As regras de artefatos e operações abaixo permanecem obrigatórias.

rules:
  proposal:
    - Incluir objetivos e itens explicitamente fora do escopo
    - Identificar os pacotes e as APIs públicas afetadas
    - Separar o trabalho da biblioteca reutilizável do trabalho da aplicação de demonstração
    - Explicar o valor da mudança para as aplicações consumidoras
    - Evitar incluir famílias de componentes não relacionadas na mesma proposta

  specs:
    - Escrever requisitos como comportamentos observáveis
    - Incluir cenários de acessibilidade, responsividade e temas
    - Distinguir requisitos obrigatórios do MVP de melhorias futuras
    - Incluir cenários de uso em aplicações Next.js quando aplicável
    - Especificar estados como carregamento, desabilitado, erro e vazio quando aplicável
    - Especificar o comportamento de personalização por design tokens
    - Evitar prescrever detalhes internos de implementação nos requisitos

  design:
    - Documentar os limites entre Client Components e Server Components
    - Documentar as decisões de acessibilidade
    - Documentar a integração entre Tailwind CSS e variáveis CSS
    - Documentar como o CSS será compilado e distribuído
    - Documentar as decisões sobre estilos, tokens e limites entre pacotes
    - Explicar alternativas relevantes e seus trade-offs
    - Registrar impactos no tamanho do bundle e nas dependências
    - Registrar decisões relacionadas à composição e à API pública dos componentes
    - Explicar como conflitos de CSS com aplicações consumidoras serão evitados

  tasks:
    - Organizar tarefas em incrementos independentes e verificáveis
    - Incluir testes, documentação, acessibilidade e exemplos visuais
    - Evitar tarefas que combinem vários componentes sem relação direta
    - Incluir validação de tipos, lint e build
    - Incluir uma demonstração no Storybook para cada componente público
    - Incluir testes de consumo do CSS compilado em uma aplicação Next.js
    - Incluir critérios claros para considerar cada tarefa concluída
    - Incluir uma tarefa final de formatação e validação do comando `npm run format`
    - Incluir a execução de `npm run test:e2e` e a confirmação de que nenhum teste E2E falha antes do commit
    - Exigir atualização de snapshots somente quando a mudança visual for intencional e revisada
    - Preferir comandos de teste silenciosos ou concisos no fluxo pré-PR e documentar um comando verboso equivalente para diagnóstico

operations:
  apply:
    guidance:
      - Implementar uma família coerente de componentes por vez
      - Executar testes, lint e verificação de tipos após cada família
      - Manter os artefatos do OpenSpec alinhados com decisões tomadas durante a implementação
      - Não introduzir dependências sem justificar sua necessidade
      - Evitar classes Tailwind montadas dinamicamente
      - Verificar acessibilidade antes de concluir componentes interativos
      - Executar `npx.cmd prettier --write` nos arquivos alterados antes da validação final
      - Executar `npm run format` e corrigir todas as falhas antes de marcar a change como concluída
      - Executar `npm run test:e2e` e confirmar que nenhum teste E2E falha antes do commit; atualizar snapshots apenas para mudanças visuais intencionais
      - Usar a saída concisa por padrão nos testes, preservando códigos de falha e logs diagnósticos no modo verboso

  archive:
    guidance:
      - Confirmar que todas as tarefas obrigatórias foram concluídas
      - Confirmar que testes, documentação e exemplos foram atualizados
      - Confirmar o consumo do pacote e dos estilos pela aplicação Next.js
      - Registrar limitações conhecidas e trabalhos futuros antes de arquivar
      - Confirmar que `npm run format` passa antes do arquivamento
