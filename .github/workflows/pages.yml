name: Publicar no GitHub Pages

# Publica o demo (raiz) e o Storybook (/storybook/) como um único site estático. Enquanto não
# existe versão final, o ramo de publicação é `develop` (ver docs/github-pages.md).
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  # Nunca cancela publicações; descarta apenas execuções antigas da mesma PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Construir o site
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: node ./scripts/ci-scope.mjs --summary
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run build --workspace @dvmarques/admin-ds-tokens
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run build --workspace @dvmarques/admin-ds-components
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run build --workspace @dvmarques/admin-ds-highlighted-code
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run build --workspace @dvmarques/admin-ds-admin
        if: steps.scope.outputs.docs_only != 'true'
      - name: Gerar demo estático e Storybook e montar site/
        run: npm run build:pages
        if: steps.scope.outputs.docs_only != 'true'
      - name: Verificar o site sob o subcaminho do repositório
        run: npm run test:e2e:pages
        if: steps.scope.outputs.docs_only != 'true'
        env:
          HOME: /root
      - if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Publicar
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
