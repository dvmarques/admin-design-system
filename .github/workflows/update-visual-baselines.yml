name: Atualizar baselines visuais
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @admin-ds/tokens
      - run: npm run build --workspace @admin-ds/components
      - run: npm run build --workspace @admin-ds/highlighted-code
      - run: npm run build --workspace @admin-ds/admin
      - run: npm run inspect:packages
      - run: npm run build --workspace @admin-ds/admin-demo
      - run: npm run test:e2e
      - name: Anexar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-diagnostic
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
