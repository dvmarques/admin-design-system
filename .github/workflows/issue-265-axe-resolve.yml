name: "Issue 265 - pin axe on batch 1 (temporary)"
on:
  push:
    branches:
      - issue-265-deps-batch1
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-265-deps-batch1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - name: Regenerate lockfile and verify exact axe version
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json');const v=p.packages['node_modules/axe-core'].version;if(v!=='4.12.1')throw Error('Unexpected axe-core '+v);console.log('axe-core',v)"
          npm ls axe-core --depth=0
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-265-axe-resolve.yml
          git add package-lock.json package.json
          git diff --cached --check
          git commit -m "fix(deps): resolve pinned axe-core pending accessibility remediation"
          git push origin HEAD:refs/heads/issue-265-deps-batch1
      - name: Verify formatting
        run: npm run format
