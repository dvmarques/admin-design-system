name: Auditoria visual

on:
  workflow_dispatch:
  # Validação temporária de PR enquanto corrigimos os cenários da #323.
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    name: Capturar catálogo e gerar relatório
    if: github.event_name != 'pull_request' || github.head_ref == 'feat/152-visual-coverage-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: node --test ./scripts/visual-audit-coverage.test.mjs ./scripts/visual-audit-coverage-report.test.mjs
      # Container do Playwright não herda a exceção de safe.directory do host.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm run test:quality
      - name: E2E completo (HOME do usuário root para Firefox no container)
        run: npm run test:e2e
        env:
          HOME: /root
      - run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict --no-interactive
      - name: Auditar catálogo
        run: npm run audit:visual
      - name: Publicar capturas e relatórios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auditoria-visual-${{ github.run_id }}
          path: visual-audit-results/
          if-no-files-found: warn
          retention-days: 14
