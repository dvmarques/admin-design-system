name: "Issue 265 - audit triage after develop sync (temporary)"
on:
  push:
    branches: [issue-265-deps-batch1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - name: Audit immutable original baseline, updated develop and synced feature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          git worktree add --detach "$RUNNER_TEMP/issue265-original" 1251ad6f9f5aec7ddfc1c03c50d0fb850f89c516
          git worktree add --detach "$RUNNER_TEMP/issue265-develop" 468b73b5b639da980f2de0cda3b8031a34ffbd60
          echo "UTC $(date -u '+%Y-%m-%dT%H:%M:%SZ') | Node $(node --version) | npm $(npm --version)"
          for stage in original develop synced; do
            case "$stage" in
              original) dir="$RUNNER_TEMP/issue265-original";;
              develop) dir="$RUNNER_TEMP/issue265-develop";;
              synced) dir="$GITHUB_WORKSPACE";;
            esac
            echo "Auditing $stage $(git -C "$dir" rev-parse HEAD)"
            (cd "$dir"; npm ci --ignore-scripts --no-audit --no-fund)
            for scope in all prod; do
              set +e
              if [ "$scope" = all ]; then
                (cd "$dir"; npm audit --json > "$GITHUB_WORKSPACE/audit-evidence/$stage-$scope.json")
              else
                (cd "$dir"; npm audit --json --omit=dev > "$GITHUB_WORKSPACE/audit-evidence/$stage-$scope.json")
              fi
              exitcode=$?
              set -e
              echo "$exitcode" > "audit-evidence/$stage-$scope.exit"
              echo "$stage/$scope audit exit code: $exitcode"
            done
          done
      - name: Summarize findings and affected direct/transitive packages
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const result={at:new Date().toISOString(),node:process.version,stages:{}};
          for(const stage of ['original','develop','synced']){
            result.stages[stage]={};
            for(const scope of ['all','prod']){
              const data=JSON.parse(fs.readFileSync('audit-evidence/'+stage+'-'+scope+'.json'));
              if(!data.metadata?.vulnerabilities)throw Error('Missing audit summary');
              result.stages[stage][scope]={
                count:data.metadata.vulnerabilities,
                deps:data.metadata.dependencies,
                exitCode:Number(fs.readFileSync('audit-evidence/'+stage+'-'+scope+'.exit')),
                vulnerabilities:Object.entries(data.vulnerabilities||{}).map(([name,x])=>({
                  name,severity:x.severity,isDirect:x.isDirect,range:x.range,effects:x.effects,
                  via:(x.via||[]).map(v=>typeof v==='string'?v:{name:v.name,title:v.title,url:v.url,severity:v.severity,range:v.range}),
                  fixAvailable:x.fixAvailable,nodes:x.nodes
                }))
              };
            }
          }
          fs.writeFileSync('audit-evidence/summary.json',JSON.stringify(result,null,2)+'\n');
          console.log('AUDIT_265_SUMMARY='+JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-265-audit-after-develop-sync
          path: audit-evidence/
          retention-days: 30
