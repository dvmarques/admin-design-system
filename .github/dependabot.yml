version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '07:15'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '07:45'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
