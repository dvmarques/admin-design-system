name: Atualizar baselines visuais
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
      env:
        HOME: /root
        CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - name: Anexar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validate-linux-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
