name: "Issue 265 - validate dependency batch 1 (temporary)"
on:
  push:
    branches:
      - issue-265-deps-batch1
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-265-deps-batch1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format verification
        run: npm run format
      - name: Lint and types
        run: |
          npm run lint
          npm run typecheck
      - name: Build packages and apps
        run: |
          npm run build
          npm run test:output --workspace @admin-ds/docs
      - name: Tests and coverage
        run: |
          npm run test:quality
          npm run test:coverage
      - name: Distribution and OpenSpec
        run: |
          npm run inspect:packages
          npm run verify:optional-peer
          npx --yes @fission-ai/openspec@1.15.0 validate --all --strict --no-interactive
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-265-validate-batch1.yml
          git commit -m "ci: remove temporary validation workflow for #265"
          git push origin HEAD:refs/heads/issue-265-deps-batch1
