name: "Issue 265 - sync develop preserving history (temporary)"
on:
  push:
    branches:
      - issue-265-deps-batch1
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/issue-265-deps-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-265-deps-batch1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package graph on merged develop without resetting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin develop
          echo "Feature head: $(git rev-parse HEAD)"
          echo "Develop head: $(git rev-parse origin/develop)"
          git merge --no-commit --no-ff -X theirs origin/develop
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import cp from 'node:child_process';
          const target = {
            '@testing-library/jest-dom': '^7.0.1',
            '@testing-library/react': '^16.3.3',
            '@types/react': '^19.3.0',
            '@types/react-dom': '^19.3.0',
            'axe-core': '4.12.1',
            'esbuild': '0.28.2',
            'eslint': '^10.13.0',
            'next': '^16.4.3',
            'prettier': '^3.9.10',
            'react': '^19.3.1',
            'react-dom': '^19.3.1',
            'typescript-eslint': '^8.72.1'
          };
          for(const file of ['package.json','apps/admin-demo/package.json','apps/docs/package.json']){
            let contents=fs.readFileSync(file,'utf8');
            const obj=JSON.parse(contents);
            for(const field of ['dependencies','devDependencies']){
              for(const [name,version] of Object.entries(target)){
                const old=obj[field]?.[name];
                if(old===undefined || old===version)continue;
                const before=JSON.stringify(name)+': '+JSON.stringify(old);
                if(!contents.includes(before))throw Error('Could not locate dependency '+name+' in '+file);
                contents=contents.replace(before,JSON.stringify(name)+': '+JSON.stringify(version));
              }
            }
            if(file==='package.json'){
              contents=contents.replace('"esbuild@0.28.1": true','"esbuild@0.28.2": true');
              const parsed=JSON.parse(contents);
              if(parsed.engines.node!=='>=24.0.0'||!parsed.scripts['verify:distribution'])throw Error('Develop publish contract lost');
            } else if(!Object.keys(JSON.parse(contents).dependencies).some(k=>k.startsWith('@dvmarques/admin-ds-')))throw Error('Issue #194 package names lost: '+file);
            fs.writeFileSync(file,contents);
          }
          const previous=cp.execFileSync('git',['show','HEAD:CHANGELOG.md'],{encoding:'utf8'});
          const entries=previous.split('\n').filter(l=>l.startsWith('- `issue-265-'));
          if(entries.length!==2)throw Error('Missing original #265 changelog entries');
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          if(!changelog.includes('issue-194-public-npm-packages'))throw Error('Issue #194 changelog missing');
          const missing=entries.filter(l=>!changelog.includes(l.slice(0,45))).map(l=>l.replace('Verificação completa de CI/E2E ainda pendente nesta PR Draft.','CI/E2E passaram antes da sincronização com a develop; revalidar este SHA.'));
          if(missing.length)changelog=changelog.replace('#### Changed\n\n','#### Changed\n\n'+missing.join('\n\n')+'\n\n');
          fs.writeFileSync('CHANGELOG.md',changelog);
          const docs=['openspec/changes/issue-265-update-dependencies/design.md','openspec/changes/issue-265-update-dependencies/proposal.md'];
          for(const file of docs){
            let data=fs.readFileSync(file,'utf8').replaceAll('@admin-ds/*','@dvmarques/admin-ds-*');
            fs.writeFileSync(file,data);
          }
          console.log('Preserved #194 workspaces and #265 changelog entries');
          NODE
          npm install --global npm@11.19.1
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          git rm .github/workflows/issue-265-sync-temporary.yml
          git add package.json package-lock.json apps/docs/package.json apps/admin-demo/package.json CHANGELOG.md openspec/changes/issue-265-update-dependencies/design.md openspec/changes/issue-265-update-dependencies/proposal.md
          git diff --cached --check
          git status --short
          HUSKY=0 git commit -m "merge(develop): sync #265 with #194 package publication changes"
          git push origin HEAD:refs/heads/issue-265-deps-batch1
      - name: Final committed lockfile verification
        run: |
          npm run format
          npm audit --audit-level=high
