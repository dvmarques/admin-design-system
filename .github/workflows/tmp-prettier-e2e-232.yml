name: Format E2E issue 232 temporary
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  fmt-232:
    if: github.event.pull_request.head.ref == 'feat/232-ads-file-upload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx prettier --write e2e/file-upload.spec.ts
      - run: node -e "console.log('FORMATTED232::e2e/file-upload.spec.ts::'+require('node:fs').readFileSync('e2e/file-upload.spec.ts').toString('base64'))"
