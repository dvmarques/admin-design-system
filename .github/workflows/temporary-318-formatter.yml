name: Temporary formatter for #318

on:
  push:
    branches:
      - feat/318-responsive-layout-patterns

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-318-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format files flagged by official CI
        run: |
          npx prettier --write \
            "apps/admin-demo/app/(admin)/exemplos/composicao-semantica/consulta/page.tsx" \
            "apps/admin-demo/app/(admin)/exemplos/composicao-semantica/dashboard/page.tsx" \
            "apps/admin-demo/app/(admin)/exemplos/composicao-semantica/formulario/page.tsx" \
            "docs/responsive-layout.md" \
            "e2e/responsive-layout.spec.ts" \
            "openspec/changes/issue-318-responsive-layout/design.md" \
            "openspec/changes/issue-318-responsive-layout/proposal.md" \
            "openspec/changes/issue-318-responsive-layout/specs/responsive-layout/spec.md" \
            "openspec/changes/issue-318-responsive-layout/validation.md" \
            "visual-audit/responsive-layout.spec.ts"
      - name: Commit formatting only on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "apps/admin-demo/app/(admin)/exemplos/composicao-semantica/consulta/page.tsx" \
            "apps/admin-demo/app/(admin)/exemplos/composicao-semantica/dashboard/page.tsx" \
            "apps/admin-demo/app/(admin)/exemplos/composicao-semantica/formulario/page.tsx" \
            "docs/responsive-layout.md" \
            "e2e/responsive-layout.spec.ts" \
            "openspec/changes/issue-318-responsive-layout/design.md" \
            "openspec/changes/issue-318-responsive-layout/proposal.md" \
            "openspec/changes/issue-318-responsive-layout/specs/responsive-layout/spec.md" \
            "openspec/changes/issue-318-responsive-layout/validation.md" \
            "visual-audit/responsive-layout.spec.ts"
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style(layout): format #318 sources [format-318-done]"
          git push origin "HEAD:feat/318-responsive-layout-patterns"
