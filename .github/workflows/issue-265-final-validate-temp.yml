# Temporário da #265: validação integrada; remover antes do merge.
name: "Issue 265 batch3 - integrated validate"

on:
  push:
    branches:
      - issue-265-deps-batch3
    paths:
      - .github/workflows/issue-265-final-validate-temp.yml

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Report npm outdated (nonzero expected for intentional exceptions)
        shell: bash
        run: |
          set +e
          npm outdated --json > /tmp/issue-265-outdated.json
          code=$?
          set -e
          node -e "const a=require('/tmp/issue-265-outdated.json'); console.log('OUTDATED_JSON:'+JSON.stringify(a)); console.log('OUTDATED_PACKAGE_COUNT:'+Object.keys(a).length)"
          echo "npm outdated exit code: $code"
      - name: Run full integrated project validation
        run: |
          npx --no-install prettier --write .github/workflows/issue-265-final-validate-temp.yml
          npm run validate
        env:
          HOME: /root
