name: Atualizar baselines visuais

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Gerar baselines Linux
    if: github.ref_name != 'develop' && github.ref_name != 'master'
    runs-on: ubuntu-latest
    steps:
      # Com o segredo, o push dos baselines vem de um usuário (PAT) e dispara a CI da PR.
      # Sem ele, vale o `GITHUB_TOKEN`, cujo push não dispara workflows (veja docs/quality.md).
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.VISUAL_BASELINES_TOKEN || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - run: npm run build --workspace @admin-ds/tokens
      - run: npm run build --workspace @admin-ds/components
      - run: npm run build --workspace @admin-ds/admin
      - run: npm run build --workspace @admin-ds/admin-demo
      - name: Regenerar os snapshots
        run: npx playwright test --project=chromium --update-snapshots=all --reporter=dot
      - name: Confirmar que os novos baselines passam sem atualização
        run: npx playwright test --project=chromium --reporter=dot
      - name: Registrar os baselines na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e
          if git diff --cached --quiet; then
            echo "Nenhum baseline mudou."
            exit 0
          fi
          git commit -m "test(e2e): atualiza baselines visuais Linux"
          git push
      - name: Anexar o relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
