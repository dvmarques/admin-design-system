name: Auditoria visual

on:
  workflow_dispatch:
  # Acionamento temporário exclusivamente para validar a PR #323 antes de Ready.
  push:
    branches:
      - feat/152-visual-coverage-matrix

permissions:
  contents: read

jobs:
  audit:
    name: Capturar catálogo e gerar relatório
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Prepara apenas os seis arquivos alterados; publica os bytes formatados no log
      # para transferir o patch ao commit da própria PR sem conceder write ao runner.
      - name: Preparar e exportar formatação da PR
        run: |
          npx prettier --write scripts/visual-audit-coverage-report.mjs scripts/visual-audit-coverage-report.test.mjs scripts/visual-audit-coverage.mjs scripts/visual-audit-coverage.test.mjs visual-audit/coverage-matrix.json visual-audit/states.spec.ts
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const files = ["scripts/visual-audit-coverage-report.mjs", "scripts/visual-audit-coverage-report.test.mjs", "scripts/visual-audit-coverage.mjs", "scripts/visual-audit-coverage.test.mjs", "visual-audit/coverage-matrix.json", "visual-audit/states.spec.ts"];
            for (const file of files) {
              const data = readFileSync(file).toString("base64");
              for (let index = 0; index < data.length; index += 2500) {
                console.log("ADS_FORMAT|" + file + "|" + (index / 2500) + "|" + data.slice(index, index + 2500));
              }
            }
          '
      - run: npm run format
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: node --test ./scripts/visual-audit-coverage.test.mjs ./scripts/visual-audit-coverage-report.test.mjs
      - run: npm run test:quality
      - run: npm run test:e2e
      - run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict --no-interactive
      - name: Auditar catálogo
        run: npm run audit:visual
      - name: Publicar capturas e relatórios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auditoria-visual-${{ github.run_id }}
          path: visual-audit-results/
          if-no-files-found: warn
          retention-days: 14
