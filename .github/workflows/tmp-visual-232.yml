name: Visual baseline review issue 232 (temporary)
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  baseline-232:
    if: github.event.pull_request.head.ref == 'feat/232-ads-file-upload'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @dvmarques/admin-ds-tokens
      - run: npm run build --workspace @dvmarques/admin-ds-components
      - run: npm run build --workspace @dvmarques/admin-ds-highlighted-code
      - run: npm run build --workspace @dvmarques/admin-ds-admin
      - run: npm run build --workspace @admin-ds/admin-demo
      - name: Generate changed baselines with official Playwright
        run: npx playwright test --project=chromium --update-snapshots=changed --reporter=dot
      - name: Report changed baseline PNGs without writing to repository
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const list = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).split('\n').filter(Boolean);
          console.log('BASELINE232FILES::'+JSON.stringify(list));
          if(list.length>12 || list.some(x=>!/^e2e\/[\w.-]+\.spec\.ts-snapshots\/[\w.-]+\.png$/.test(x))) throw Error('Unexpected baseline changes');
          for(const path of list) console.log('BASELINE232::'+path+'::'+readFileSync(path).toString('base64'));
          NODE
      - name: Confirm updated baselines are exact
        run: npx playwright test --project=chromium --reporter=dot
