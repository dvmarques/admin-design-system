name: Temporary review formatter 250
on:
  push:
    branches:
      - fix/244-tooltip-anchor-position
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-250]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write e2e/overlay-position.spec.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/overlay-position.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(#250): format adjusted position test [format-250]"
            git push origin HEAD:fix/244-tooltip-anchor-position
          fi
