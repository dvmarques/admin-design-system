name: "Issue 265 - final batch 1 verification (temporary)"
on:
  push:
    branches:
      - issue-265-deps-batch1
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-265-deps-batch1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Remove temporary workflow before formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-265-verify-ordered.yml
          git commit -m "ci: clean temporary verification workflow"
          git push origin HEAD:refs/heads/issue-265-deps-batch1
      - name: Formatting and lint
        run: |
          npm run format
          npm run lint
      - name: Build package dependency graph first
        run: npm run build
      - name: Workspace typecheck
        run: npm run typecheck
      - name: Quality and coverage
        run: |
          npm run test:quality
          npm run test:coverage
      - name: Docs and distribution checks
        run: |
          npm run test:output --workspace @admin-ds/docs
          npm run inspect:packages
          npm run verify:optional-peer
      - name: OpenSpec strict validation
        run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict --no-interactive
