name: "Issue 265 - verificar baselines sob suite completa (temporario)"
on:
  push:
    branches: [issue-265-deps-batch2]
    paths:
      - .github/workflows/issue-265-batch2-visual-full.yml
permissions:
  contents: write
concurrency:
  group: issue-265-batch2-visual-full
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-265-deps-batch2
          fetch-depth: 0
          persist-credentials: true
      - name: Conferir o worktree Git dentro do container antes da suite longa
        shell: bash
        run: |
          set -euo pipefail
          printf 'workspace=%s cwd=%s\\n' "$GITHUB_WORKSPACE" "$PWD"
          ls -ld "$GITHUB_WORKSPACE/.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" status --short
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace @dvmarques/admin-ds-tokens
      - run: npm run build --workspace @dvmarques/admin-ds-components
      - run: npm run build --workspace @dvmarques/admin-ds-highlighted-code
      - run: npm run build --workspace @dvmarques/admin-ds-admin
      - run: npm run build --workspace @admin-ds/admin-demo
      - name: Comparar a suite Chromium inteira e atualizar somente snapshots alterados
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --project=chromium --update-snapshots=changed --reporter=dot
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" diff --name-only | sort > /tmp/changed
          printf '%s\n' e2e/admin-demo-routes.spec.ts-snapshots/componentes-dark-chromium-linux.png e2e/admin-demo-routes.spec.ts-snapshots/componentes-light-chromium-linux.png | sort > /tmp/allowed
          echo "CHANGED_SNAPSHOTS:"
          cat /tmp/changed
          if [ -s /tmp/changed ] && [ -n "$(comm -23 /tmp/changed /tmp/allowed)" ]; then
            echo "Unexpected snapshot changes; refusing commit" >&2
            comm -23 /tmp/changed /tmp/allowed
            exit 1
          fi
      - name: Commit limitado a snapshots de componentes, sem alterar limite de diff
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/admin-demo-routes.spec.ts-snapshots/componentes-dark-chromium-linux.png e2e/admin-demo-routes.spec.ts-snapshots/componentes-light-chromium-linux.png
          git diff --cached --check
          if git diff --cached --quiet; then echo "Snapshots iguais; sem commit"; exit 0; fi
          HUSKY=0 git commit -m "test(e2e): synchronize Chromium 1.64.1 light/dark component snapshots (#265)"
          git push origin HEAD:refs/heads/issue-265-deps-batch2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: issue-265-batch2-full-visual-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
