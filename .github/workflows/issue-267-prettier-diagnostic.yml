name: Issue 267 formatting diagnostic

on:
  push:
    branches:
      - issue-267-security-gates

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Produce exact Prettier results for review
        shell: bash
        run: |
          npx prettier --write .github/security/audit-exceptions.json docs/security/continuous-gates.md scripts/security-audit.mjs scripts/security-audit.test.mjs
          for path in .github/security/audit-exceptions.json docs/security/continuous-gates.md scripts/security-audit.mjs scripts/security-audit.test.mjs; do
            printf '__FORMAT_START__%s\n' "$path"
            base64 -w0 "$path"
            printf '\n__FORMAT_END__%s\n' "$path"
          done
