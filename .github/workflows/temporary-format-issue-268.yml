name: Formatar arquivos da issue 268 (temporário)

on:
  push:
    branches:
      - issue-268-actions-hardening

permissions:
  contents: read

jobs:
  format:
    name: Pré-formatar arquivos alterados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Gerar saídas formatadas sem gravar no repositório
        run: |
          ./node_modules/.bin/prettier --write CHANGELOG.md docs/security/workflow-hardening.md openspec/changes/issue-268-github-actions-hardening/design.md scripts/verify-workflow-supply-chain.mjs scripts/visual-baseline-transfer.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const file of ['CHANGELOG.md', 'docs/security/workflow-hardening.md', 'openspec/changes/issue-268-github-actions-hardening/design.md', 'scripts/verify-workflow-supply-chain.mjs', 'scripts/visual-baseline-transfer.mjs']) {
            console.log('FORMATTED_FILE:' + file + ':' + readFileSync(file).toString('base64'));
          }
          NODE
