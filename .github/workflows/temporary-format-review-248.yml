name: Temporary formatter for review 248
on:
  push:
    branches:
      - fix/242-textarea-typography
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-review]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed files
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR origin/develop...HEAD | grep -E '\.(tsx?|js|mjs|json|md|css|ya?ml)$' | while IFS= read -r file; do
            npx prettier --write "$file"
          done
      - name: Commit only formatting changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(#248): apply Prettier [format-review]"
            git push origin HEAD:fix/242-textarea-typography
          fi
