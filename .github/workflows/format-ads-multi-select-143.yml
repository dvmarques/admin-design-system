name: Formatar AdsMultiSelect #143 (temporário)
on:
  push:
    branches:
      - feat/143-ads-multi-select
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prettier:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/143-ads-multi-select
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Official Prettier for changed files
        run: |
          npx prettier --write \
            apps/admin-demo/app/catalogo/catalog-demos.tsx \
            apps/docs/src/multi-select.stories.tsx \
            docs/admin-demo-catalog.md \
            docs/component-changelog.md \
            docs/integration.md \
            docs/limitations.md \
            packages/components/src/multi-select.tsx \
            packages/components/tests/multi-select.test.tsx
          node scripts/catalog-snippets.mjs
          npx prettier --write apps/admin-demo/app/catalogo/catalog-snippets.json
          npm run format
      - name: Commit formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin-demo/app/catalogo/catalog-demos.tsx \
                  apps/admin-demo/app/catalogo/catalog-snippets.json \
                  apps/docs/src/multi-select.stories.tsx \
                  docs/admin-demo-catalog.md \
                  docs/component-changelog.md \
                  docs/integration.md \
                  docs/limitations.md \
                  packages/components/src/multi-select.tsx \
                  packages/components/tests/multi-select.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(multi-select): executar Prettier oficial (#143)"
            git push origin HEAD:feat/143-ads-multi-select
          fi
