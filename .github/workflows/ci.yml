name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Qualidade rápida
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Apenas informa o escopo; este job sempre executa a validação completa.
      - run: node ./scripts/ci-scope.mjs --summary
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run format
      - run: npm run lint
      - run: npm run build --workspace @admin-ds/tokens
      - run: npm run build --workspace @admin-ds/components
      - run: npm run build --workspace @admin-ds/highlighted-code
      - run: npm run build --workspace @admin-ds/admin
      - run: npm run typecheck
      - run: npm run test:quality
      - name: Gerar cobertura dos testes Node de CI
        run: npm run test:ci
        env:
          NODE_V8_COVERAGE: coverage/node-ci
      - name: Gerar cobertura dos testes Vitest
        run: npm run test:coverage
      - name: Publicar cobertura dos testes Vitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-vitest
          path: coverage/vitest/
          if-no-files-found: warn
          retention-days: 14
      - name: Publicar cobertura dos testes Node de CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-node-ci
          path: coverage/node-ci/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Artefatos de distribuição
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        run: node ./scripts/ci-scope.mjs
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm ci --ignore-scripts
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run generate --workspace @admin-ds/tokens
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run check:generated --workspace @admin-ds/tokens
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run build --workspace @admin-ds/tokens
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run build --workspace @admin-ds/components
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run build --workspace @admin-ds/highlighted-code
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run build --workspace @admin-ds/admin
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run build --workspace @admin-ds/docs
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.build_docs != 'false'
      - run: npm run test:output --workspace @admin-ds/docs
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.build_docs != 'false'
      - run: npm run build --workspace @admin-ds/admin-demo
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.build_demo != 'false'
      - run: npm run inspect:packages
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run verify:optional-peer
        if: steps.scope.outputs.docs_only != 'true'

  e2e:
    name: ${{ matrix.check }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
      env:
        HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            check: Fluxos no navegador
          - browser: firefox
            check: Fluxos no navegador (Firefox)
          - browser: webkit
            check: Fluxos no navegador (WebKit)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        run: node ./scripts/ci-scope.mjs
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
      - run: npm ci --ignore-scripts
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
      - name: Verificar versão Playwright da imagem e do lockfile
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
        shell: bash
        run: |
          EXPECTED=1.62.0
          node --version
          npm --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test "$(npm --version)" = 11.19.1
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = require('./package-lock.json');
          const expected = '1.62.0';
          for (const name of ['@playwright/test', 'playwright', 'playwright-core']) {
            const locked = lock.packages['node_modules/' + name]?.version;
            const installed = require(name + '/package.json').version;
            if (locked !== expected || installed !== expected) {
              throw new Error(name + ': imagem=' + expected + ', lockfile=' + locked + ', instalado=' + installed);
            }
          }
          const { chromium, firefox, webkit } = require('playwright');
          for (const [name, browser] of Object.entries({ chromium, firefox, webkit })) {
            const executable = browser.executablePath();
            if (!fs.existsSync(executable)) {
              throw new Error(name + ': executável ausente na imagem: ' + executable);
            }
          }
          NODE
      - run: npm run build --workspace @admin-ds/tokens
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
      - run: npm run build --workspace @admin-ds/components
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
      - run: npm run build --workspace @admin-ds/highlighted-code
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
      - run: npm run build --workspace @admin-ds/admin
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
      - run: npm run build --workspace @admin-ds/admin-demo
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
      - run: npx playwright test --project=${{ matrix.browser }}
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.e2e != 'false'
        env:
          HOME: /root

  develop-policy:
    name: Política de develop
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: node ./scripts/develop-policy.mjs
      - run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict --no-interactive

  release-check:
    name: Validação de release
    if: github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Validar identidade e preparação
        shell: bash
        run: |
          if [[ ! "$GITHUB_HEAD_REF" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "PRs para master devem vir de release/X.Y.Z" >&2
            exit 1
          fi
          VERSION="${GITHUB_HEAD_REF#release/}"
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "$GITHUB_REPOSITORY" ]]; then
            echo "Release PR deve vir do mesmo repositório" >&2
            exit 1
          fi
          npm run release:validate -- "$VERSION"
          node ./scripts/release-github.mjs target-absent "$VERSION"
          node ./scripts/release-github.mjs bootstrap-remote "$VERSION"
          node ./scripts/release-github.mjs predecessor "$VERSION"
      - name: Validar delta exclusivo da release
        shell: bash
        run: |
          git fetch origin develop --no-tags
          BASE="$(git merge-base HEAD origin/develop)"
          BAD="$(git diff --name-only "$BASE"...HEAD | grep -Ev '^(CHANGELOG\.md|package\.json|package-lock\.json|(packages|apps)/[^/]+/package\.json)$' || true)"
          if [[ -n "$BAD" ]]; then
            echo "Release branch contém alterações funcionais exclusivas:" >&2
            echo "$BAD" >&2
            exit 1
          fi
      - run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict --no-interactive
