name: Publicar no GitHub Pages

# Publica o demo (raiz) e o Storybook (/storybook/) como um único site estático. Enquanto não
# existe versão final, o ramo de publicação é `develop` (ver docs/github-pages.md).
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: Construir o site
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @dvmarques/admin-ds-tokens
      - run: npm run build --workspace @dvmarques/admin-ds-components
      - run: npm run build --workspace @dvmarques/admin-ds-highlighted-code
      - run: npm run build --workspace @dvmarques/admin-ds-admin
      - name: Gerar demo estático e Storybook e montar site/
        run: npm run build:pages
      - name: Verificar o site sob o subcaminho do repositório
        run: npm run test:e2e:pages
        env:
          HOME: /root
      - if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publicar
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
